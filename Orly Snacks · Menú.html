<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index.html</title>
<meta name="theme-color" content="#fffaf2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== COLORES: cambia aquí la paleta completa ===== */
:root{--bg:#fffaf2;--crema:#fbefdc;--cafe:#7a2a10;--amarillo:#f4c04e;--texto:#2a1a0e;--linea:#eadfce;--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130b;--crema:#2b1c10;--cafe:#f0b48f;--texto:#fbeedd;--linea:#3a3028}}
:root[data-theme="dark"]{--bg:#1d130b;--crema:#2b1c10;--cafe:#f0b48f;--texto:#fbeedd;--linea:#3a3028}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--texto);font-family:Poppins,system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
h1,h2,h3,.display{text-wrap:balance;font-family:"Baloo 2",system-ui,sans-serif;line-height:.92}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
button{font:inherit;cursor:pointer;border:0}
.precio,.total,.fila,.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px;border-radius:4px}
::selection{background:var(--amarillo);color:#2a1a0e}
input{caret-color:var(--cafe)}
.cats,.lista{scrollbar-color:var(--linea) transparent}
a{text-underline-offset:3px}

/* PORTADA: titular enorme con el emoji por encima, como en la referencia */
.hero{background:var(--crema);text-align:center;position:relative;overflow:hidden;padding:20px 0 0;height:min(78vw,430px)}
.hero h1{color:var(--cafe);font-weight:800;font-size:clamp(3.2rem,15vw,6rem);text-transform:uppercase}
.hero .foto{position:absolute;left:50%;bottom:-4%;transform:translateX(-50%);font-size:clamp(8rem,36vw,17rem);line-height:1;animation:sube .45s var(--ease-out) both}
@keyframes sube{from{opacity:0;transform:translateX(-50%) translateY(14px)}}

/* PROMO: una sola línea, sin caja */
.promo{text-align:center;font-size:.85rem;color:var(--cafe);font-weight:500;padding:14px 0 0}

h2.titulo{text-align:center;color:var(--cafe);font-weight:800;font-size:clamp(1.5rem,5vw,2.2rem);text-transform:uppercase;margin:36px 0 14px}
.buscar{display:block;width:100%;max-width:420px;margin:0 auto 18px;padding:11px 16px;border-radius:12px;border:1px solid var(--linea);background:transparent;color:var(--texto);font:inherit;font-size:.9rem}

/* CATEGORÍAS: cuadros planos */
.cats{display:flex;gap:10px;overflow-x:auto;padding:8px 2px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 84px;background:none;color:var(--texto);text-align:center;font-size:.8rem}
.cat span{display:grid;place-items:center;height:84px;border-radius:16px;background:var(--crema);font-size:2.4rem;margin-bottom:6px;transition:background-color 200ms ease,transform 160ms var(--ease-out)}
.cat:active span{transform:scale(.97)}
.cat img{width:64px;height:64px;object-fit:cover;border-radius:50%}
.cat[aria-pressed="true"] span{background:var(--cafe)}
.cat[aria-pressed="true"]{font-weight:600}
@media(min-width:700px){.cats{justify-content:center}}

/* TARJETAS: planas, solo 3 colores */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0 10px}
.card{position:relative;border-radius:18px;padding:16px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.card .info{position:relative;z-index:1;max-width:60%}
.card h3{font-size:1.3rem;font-weight:800;text-transform:uppercase}
.card p{font-size:.75rem;opacity:.85;margin-top:6px;line-height:1.35}
.card .precio{font-weight:600;font-size:.95rem;margin:8px 0 6px;position:relative;z-index:1}
.card .emoji{position:absolute;right:-4%;top:50%;transform:translateY(-55%);font-size:6.5rem;line-height:1}
.card img{position:absolute;right:-9%;top:50%;transform:translateY(-52%);width:min(58%,200px);aspect-ratio:1;object-fit:cover;border-radius:50%}
.card .tag{position:absolute;top:10px;right:12px;font-size:.75rem;font-weight:600;opacity:.85;z-index:2}
.add{position:relative;z-index:1;align-self:flex-start;background:var(--amarillo);color:#5a1d0a;font-weight:600;font-size:.8rem;min-height:40px;padding:0 18px;border-radius:99px;transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.add:active{transform:scale(.97)}
.add.ok{background:#fff;color:#1a7a3c}
.c0{background:#7a2a10;color:#fff6ea}
.c1{background:var(--amarillo);color:#2a1a0e}.c1 .add{background:#fff;color:#2a1a0e}
.c2{background:var(--crema);color:var(--texto)}.c2 .add{background:#7a2a10;color:#fff}
.card.in{animation:entra 260ms var(--ease-out) both;animation-delay:calc(min(var(--i),8) * 40ms)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.vacio{grid-column:1/-1;text-align:center;padding:30px;opacity:.65;font-size:.9rem}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}#grid .card:nth-child(6n+1),#grid .card:nth-child(6n+2){grid-column:span 2}}
@media(max-width:699px){#grid .card:nth-child(5n+1){grid-column:span 2}#grid .card:nth-child(5n+1) .info{max-width:50%}}

/* INFO: texto simple con líneas */
.info-sec{display:grid;gap:0;margin:40px 0 100px;border-top:1px solid var(--linea)}
.box{padding:18px 0;border-bottom:1px solid var(--linea)}
.box h3{color:var(--cafe);font-size:1.25rem;margin-bottom:4px}
.box a{color:var(--cafe);font-weight:600}
.box p{font-size:.88rem}
@media(min-width:700px){.info-sec{grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid var(--linea)}.box{border-bottom:0}}

/* CARRITO */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--cafe);color:#fff;padding:13px 20px;border-radius:99px;font-weight:600;font-size:.9rem;min-height:48px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 16px rgba(60,20,5,.22)}
:root[data-theme="dark"] .fab{color:#2a1a0e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#2a1a0e}}
.fab .n{background:var(--amarillo);color:#2a1a0e;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.75rem}
.fondo{position:fixed;inset:0;background:rgba(20,10,5,.5);opacity:0;pointer-events:none;transition:opacity 200ms ease-out;z-index:30}
.fondo.on{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:86%;background:var(--bg);border-radius:22px 22px 0 0;z-index:31;transform:translateY(105%);visibility:hidden;transition:transform 300ms var(--ease-drawer),visibility 0s linear 300ms;display:flex;flex-direction:column;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto}
.panel.on{transform:none;visibility:visible;transition-delay:0s}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panel h2{color:var(--cafe);font-size:1.7rem;font-weight:800}
.x{background:var(--crema);color:var(--texto);width:44px;height:44px;border-radius:50%}
.lista{overflow-y:auto;flex:1;overscroll-behavior:contain}
.fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.fila .e{font-size:1.8rem}.fila .mini{width:44px;height:44px;border-radius:12px;object-fit:cover}.fila .nom{flex:1;font-weight:600;font-size:.88rem}.fila .nom small{display:block;font-weight:400;opacity:.65}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:40px;height:40px;border-radius:50%;background:var(--crema);color:var(--texto);font-weight:600}
.total{display:flex;justify-content:space-between;font-family:"Baloo 2";font-size:1.4rem;font-weight:800;margin:10px 0;color:var(--cafe)}
.pedir{width:100%;background:#167a34;color:#fff;font-weight:600;padding:13px;border-radius:99px;font-size:.95rem}
.pedir:disabled{opacity:.4;cursor:not-allowed}
.nota{width:100%;margin:0 0 8px;padding:10px 14px;border-radius:12px;border:1px solid var(--linea);background:transparent;color:var(--texto);font:inherit;font-size:.85rem}
@keyframes fundir{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
.card.in{animation-name:fundir;animation-delay:0ms}
.hero .foto{animation-name:fundir}
.panel{transition:opacity 150ms ease,visibility 0s linear 150ms;opacity:0;transform:none;pointer-events:none}
.panel.on{opacity:1;pointer-events:auto;transition-delay:0s}
.fondo{transition-duration:150ms}}
@media (hover:hover) and (pointer:fine){
.cat[aria-pressed="false"]:hover span{background:var(--linea)}
.pedir:not(:disabled):hover{filter:brightness(1.07)}}

/* PROMOS */
.promos{display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promos .card{scroll-snap-align:start;min-height:190px}
.card s{font-size:.75rem;opacity:.7;margin-left:6px;font-weight:400}
@media(min-width:700px){.promos{grid-auto-columns:calc((100% - 20px)/3)}}
.promo a{color:var(--cafe);font-weight:600}

/* FIESTAS */
.fiesta{display:grid;gap:22px;margin:48px 0 0}
.fiesta .foto{width:100%;aspect-ratio:16/11;object-fit:cover;border-radius:18px;display:block}
.fiesta h2.titulo{text-align:left;margin:0 0 6px}
.fiesta p.txt{font-size:.9rem;opacity:.85;margin-bottom:26px;max-width:46ch}
.grupo{border:0;padding:0;margin:0 0 22px;min-width:0}
.grupo>label,.grupo legend{display:block;font-size:.85rem;font-weight:600;margin-bottom:8px;padding:0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fiesta .nota{margin:0;background:var(--crema);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:.92rem;transition:border-color 160ms ease}
.fiesta .nota:focus{outline:0;border-color:var(--cafe)}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{position:relative}
.op input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.op span{display:block;padding:10px 15px;border-radius:99px;background:var(--crema);font-size:.85rem;transition:background-color 160ms ease,color 160ms ease,transform 160ms var(--ease-out)}
.op:active span{transform:scale(.97)}
.op input:checked+span{background:var(--cafe);color:var(--bg)}
.op input:focus-visible+span{outline:3px solid var(--amarillo);outline-offset:2px}
.otro{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 220ms var(--ease-out),opacity 180ms ease-out}
.otro>div{overflow:hidden;padding:0 3px}
.otro .nota{margin-top:10px;margin-bottom:3px}
.otro.on{grid-template-rows:1fr;opacity:1}
.err{color:#b3261e;font-size:.8rem;min-height:1.1em;margin-top:4px}
:root[data-theme="dark"] .err{color:#ffb4ab}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ffb4ab}}
.cotizar{width:100%;background:#167a34;color:#fff;font-weight:600;padding:14px;border-radius:99px;font-size:.95rem;transition:transform 160ms var(--ease-out)}
.cotizar:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.op input:not(:checked):hover+span{background:var(--linea)}.cotizar:hover{filter:brightness(1.07)}}
@media(min-width:760px){.fiesta{grid-template-columns:1fr 1fr;align-items:start;gap:40px}.fiesta .foto{aspect-ratio:1;position:sticky;top:24px}}
@media (prefers-reduced-motion:reduce){.otro{transition:opacity 150ms ease}.op:active span,.cotizar:active{transform:none}}
[hidden]{display:none!important}
::placeholder{color:var(--texto);opacity:.62}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--cafe);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:50;font-weight:600}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;margin:0 0 14px}
.consent input{width:22px;height:22px;flex:none;accent-color:var(--cafe);margin:0}
.consent a,.pie a,.legal a{color:var(--cafe);font-weight:600}
.legal{max-width:720px;padding:28px 16px 90px}
.legal h1{font-size:2.1rem;color:var(--cafe);margin:14px 0 4px}
.legal h2{font-size:1.2rem;color:var(--cafe);margin:26px 0 6px}
.legal p,.legal li{font-size:.92rem;line-height:1.65;margin-bottom:8px}
.legal ul{padding-left:20px}
.legal .fecha{font-size:.8rem;opacity:.75}
mark.falta{background:#ffe08a;color:#2a1a0e;padding:0 4px;border-radius:4px}
.pie{border-top:1px solid var(--linea);padding:26px 16px calc(90px + env(safe-area-inset-bottom,0px));max-width:1000px;margin:0 auto;font-size:.82rem;line-height:1.6}
.pie nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0}
.pie p{margin-bottom:6px;opacity:.9}
</style>
</head>
<body>

<a class="skip" href="#menu">Saltar al menú</a>
<header class="hero" id="inicio">
  <h1 id="hero-titulo">Snacks<br>que te<br>antojan</h1>
  <!-- CAMBIA EL EMOJI GRANDE por una foto de tu cliente (recortada sin fondo) -->
  <div class="foto" aria-hidden="true">🍓</div>
</header>

<main class="wrap" id="menu" tabindex="-1">
  <p class="promo"><a href="#fiestas">¿Tienes una fiesta? Cotiza tu carrito de botanas</a></p>

  <h2 class="titulo">Promociones</h2>
  <section class="promos" id="promos" aria-label="Promociones"></section>

  <h2 class="titulo">Nuestro menú</h2>
  <input class="buscar" id="buscar" type="search" placeholder="Buscar en el menú…" aria-label="Buscar productos">
  <nav class="cats" id="cats" aria-label="Categorías"></nav>
  <section class="grid" id="grid" aria-live="polite"></section>

  <section class="fiesta" id="fiestas">
    <img class="foto" id="fiesta-foto" alt="Carrito de botanas con Tostitos preparados y toppings" width="640" height="480">
    <div>
      <h2 class="titulo">Cotiza tu fiesta</h2>
      <p class="txt" id="fiesta-txt"></p>

      <fieldset class="grupo"><legend>Tipo de evento</legend>
        <div class="ops" id="f-tipos"></div>
        <div class="otro" id="otro" inert><div><input class="nota" id="f-otro" placeholder="¿Qué evento es?" aria-label="Otro tipo de evento"></div></div>
      </fieldset>

      <div class="dos">
        <div class="grupo"><label for="f-fecha">Fecha</label><input class="nota" id="f-fecha" type="date"></div>
        <div class="grupo"><label for="f-inv">Invitados</label><input class="nota" id="f-inv" type="number" min="1" inputmode="numeric"><div class="err" id="e-inv" aria-live="polite"></div></div>
      </div>
      <div class="grupo"><label for="f-lugar">Lugar o colonia</label><input class="nota" id="f-lugar"></div>

      <fieldset class="grupo"><legend>¿Qué quieres en tu carrito?</legend><div class="ops" id="f-ops"></div></fieldset>

      <div class="dos">
        <div class="grupo"><label for="f-nombre">Tu nombre</label><input class="nota" id="f-nombre" autocomplete="name"></div>
        <div class="grupo"><label for="f-notas">Notas</label><input class="nota" id="f-notas" placeholder="Horario, tema…"></div>
      </div>
      <label class="consent"><input type="checkbox" id="f-ok"><span>He leído el <a href="#/privacidad">Aviso de privacidad</a> y acepto que usen mis datos para responder mi cotización.</span></label>
      <div class="err" id="e-fok" aria-live="polite"></div>
      <button class="cotizar" id="cotizar">Cotizar por WhatsApp</button>
    </div>
  </section>

  <section class="info-sec" id="info">
    <div class="box"><h3>Horarios</h3><p id="horario"></p></div>
    <div class="box"><h3>Ubicación</h3><p id="ubicacion"></p></div>
    <div class="box"><h3>Contacto</h3><p><a id="ig" target="_blank" rel="noopener">Instagram</a><br><a id="wa" target="_blank" rel="noopener">WhatsApp</a></p></div>
  </section>
</main>

<div class="sr" id="live" aria-live="polite"></div>
<main class="wrap legal" id="legal" hidden></main>

<footer class="pie" id="pie"></footer>

<button class="fab" id="fab" aria-label="Abrir carrito">🛒 Mi pedido <span class="n" id="n">0</span></button>
<div class="fondo" id="fondo"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="t-carrito" aria-hidden="true">
  <header><h2 id="t-carrito">Mi pedido</h2><button class="x" id="cerrar" aria-label="Cerrar">✕</button></header>
  <div class="lista" id="lista"></div>
  <input class="nota" id="nombre" placeholder="Tu nombre">
  <input class="nota" id="nota" placeholder="Notas (sin cebolla, extra salsa…)">
  <label class="consent"><input type="checkbox" id="c-ok"><span>He leído el <a href="#/privacidad">Aviso de privacidad</a> y acepto que usen mis datos para atender mi pedido.</span></label>
  <div class="err" id="e-ok" aria-live="polite"></div>
  <div class="total"><span>Total</span><span id="total">$0</span></div>
  <button class="pedir" id="pedir" disabled>Pedir por WhatsApp</button>
</aside>

    <article class="card c${i%3}${animar?" in":""}" style="--i:${i}">
      ${p.tag?`<span class="tag">${p.tag}</span>`:""}
      <div class="info"><h3>${p.nombre}</h3><p>${p.desc}</p></div>
      ${p.img?`<img src="${IMG[p.img]||p.img}" alt="${ALT[p.img]||p.nombre}" loading="lazy" decoding="async">`:`<div class="emoji" aria-hidden="true">${p.emoji}</div>`}
      <div><div class="precio">${dinero(p.precio)}</div><button class="add" data-id="${p.id}" aria-label="Agregar ${p.nombre} al pedido">Agregar</button></div>
    </article>`).join("") : `<p class="vacio">No encontramos eso. Prueba con otra palabra.</p>`;
}
function pintarPromos(){
  $("promos").innerHTML = PROMOS.map((p,i) => `
    <article class="card c${i%3}">
      <span class="tag">Promo</span>
      <div class="info"><h3>${p.nombre}</h3><p>${p.desc}</p></div>
      <img src="${IMG[p.img]||p.img}" alt="${ALT[p.img]||p.nombre}" loading="lazy" decoding="async">
      <div><div class="precio">${dinero(p.precio)}${p.antes?`<s>${dinero(p.antes)}</s>`:""}</div><button class="add" data-id="${p.id}" aria-label="Agregar ${p.nombre} al pedido">Agregar</button></div>
    </article>`).join("");
}
function pintarFiesta(){
  $("fiesta-foto").src = IMG.tostitos; $("fiesta-foto").alt = ALT.tostitos; $("fiesta-txt").textContent = FIESTA.texto;
  $("f-tipos").innerHTML = FIESTA.tipos.map(t => `<label class="op"><input type="radio" name="tipo" value="${t}"><span>${t}</span></label>`).join("");
  $("f-ops").innerHTML = FIESTA.opciones.map(o => `<label class="op"><input type="checkbox" value="${o}"><span>${o}</span></label>`).join("");
  const hoy = new Date(); $("f-fecha").min = hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0")+"-"+String(hoy.getDate()).padStart(2,"0");
}
function pintarCarrito(){
  const ids = Object.keys(carrito), total = ids.reduce((s,id)=>s+carrito[id]*buscar(id).precio,0);
  const cant = ids.reduce((s,id)=>s+carrito[id],0);
  $("n").textContent = cant; $("fab").setAttribute("aria-label","Abrir pedido, "+cant+(cant==1?" producto":" productos"));
   $("total").textContent = dinero(total); $("pedir").disabled = !cant;
  $("lista").innerHTML = cant ? ids.map(id => { const p = buscar(id);
    return `<div class="fila">${p.img?`<img class="mini" src="${IMG[p.img]||p.img}" alt="">`:`<span class="e">${p.emoji}</span>`}<div class="nom">${p.nombre}<small>${dinero(p.precio)} c/u</small></div>
    <div class="qty"><button data-m="${id}" aria-label="Quitar uno">−</button><b>${carrito[id]}</b><button data-p="${id}" aria-label="Agregar uno">+</button></div></div>`;
  }).join("") : `<p class="vacio">Tu pedido está vacío. Agrega algo del menú.</p>`;
}
function abrir(v){ $("panel").classList.toggle("on",v); $("fondo").classList.toggle("on",v); $("panel").setAttribute("aria-hidden",!v); document.body.style.overflow = v ? "hidden" : ""; (v ? $("cerrar") : $("fab")).focus({preventScroll:true}); }

document.addEventListener("click", e => {
  if(e.target.closest("#panel a[href]")) abrir(false);
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.c){ catActual = t.dataset.c; pintarCats(); pintarGrid(true); }
  if(t.classList.contains("add")){
    carrito[t.dataset.id] = (carrito[t.dataset.id]||0)+1; pintarCarrito();
    $("live").textContent = ""; setTimeout(()=>{ $("live").textContent = buscar(t.dataset.id).nombre+" agregado al pedido"; },50);
    t.textContent = "¡Agregado!"; t.classList.add("ok");
    setTimeout(()=>{t.textContent="Agregar";t.classList.remove("ok")},900);
  }
  if(t.dataset.p){ carrito[t.dataset.p]++; pintarCarrito(); }
  if(t.dataset.m){ if(--carrito[t.dataset.m]<=0) delete carrito[t.dataset.m]; pintarCarrito(); }
});
$("buscar").addEventListener("input", e => { texto = e.target.value; pintarGrid(false); });
$("fab").onclick = () => abrir(true);
$("cerrar").onclick = $("fondo").onclick = () => abrir(false);
document.addEventListener("keydown", e => {
  if(e.key==="Tab" && $("panel").classList.contains("on")){
    const fs=[...$("panel").querySelectorAll("button:not(:disabled),input,a[href]")]; if(!fs.length) return;
    const a=fs[0], z=fs[fs.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
  } if(e.key==="Escape" && $("panel").classList.contains("on")) abrir(false); });
$("pedir").onclick = () => {
  const ids = Object.keys(carrito); if(!ids.length) return;
  if(!$("c-ok").checked){ $("e-ok").textContent = "Marca la casilla para poder enviar tu pedido."; $("c-ok").focus(); return; }
  $("e-ok").textContent = "";
  let total = 0;
  const lineas = ids.map(id => { const p = buscar(id); const s = p.precio*carrito[id]; total += s;
    return `• ${carrito[id]} x ${p.nombre} — ${dinero(s)}`; });
  const nombre = $("nombre").value.trim(), nota = $("nota").value.trim();
  const msg = `Hola ${NEGOCIO.nombre}, quiero hacer un pedido:\n\n${lineas.join("\n")}\n\nTotal: ${dinero(total)}` +
    (nombre?`\nNombre: ${nombre}`:"") + (nota?`\nNotas: ${nota}`:"");
  abrirWA(msg, $("e-ok"));
};
$("cotizar").onclick = () => {
  const inv = parseInt($("f-inv").value,10);
  if(!(inv > 0)){ $("e-inv").textContent = "Escribe cuántas personas serán."; $("f-inv").focus(); return; }
  $("e-inv").textContent = "";
  if(!$("f-ok").checked){ $("e-fok").textContent = "Marca la casilla para poder enviar tu cotización."; $("f-ok").focus(); return; }
  $("e-fok").textContent = "";
  const v = id => $(id).value.trim(), ops = [...document.querySelectorAll("#f-ops input:checked")].map(i => i.value);
  const tipo = document.querySelector("#f-tipos input:checked"), evento = tipo ? (tipo.value==="Otro" ? (v("f-otro")||"Otro") : tipo.value) : "";
  const fecha = v("f-fecha") ? v("f-fecha").split("-").reverse().join("/") : "";
  const msg = `Hola ${NEGOCIO.nombre}, quiero cotizar el carrito de botanas para una fiesta:\n\n` +
    (v("f-nombre")?`Nombre: ${v("f-nombre")}\n`:"") + (evento?`Evento: ${evento}\n`:"") + (fecha?`Fecha: ${fecha}\n`:"") +
    `Invitados: ${inv}\n` + (v("f-lugar")?`Lugar: ${v("f-lugar")}\n`:"") + (ops.length?`Productos: ${ops.join(", ")}\n`:"") + (v("f-notas")?`Notas: ${v("f-notas")}`:"");
  abrirWA(msg, $("e-fok"));
};
$("f-tipos").addEventListener("change", e => {
  const on = e.target.value === "Otro"; $("otro").classList.toggle("on", on); $("otro").inert = !on;
  if(on) $("f-otro").focus({preventScroll:true});
});
$("f-inv").addEventListener("input", () => { $("e-inv").textContent = ""; });
pintarCats(); pintarGrid(true); pintarPromos(); pintarFiesta(); pintarCarrito();
/* =====================================================
   5) PÁGINAS LEGALES Y PIE  (se llenan con los datos de NEGOCIO)

   Revisa todo con un abogado o con Profeco antes de publicar.
   ===================================================== */
const F = "4 de octubre de 2026";
const d = x => /^\[COMPLETA/.test(x) ? `<mark class="falta">${x}</mark>` : x;
const contacto = () => `${d(NEGOCIO.responsable)}, con domicilio en ${d(NEGOCIO.domicilio)}. Correo: ${d(NEGOCIO.correo)}. Teléfono: ${d(NEGOCIO.telefono)}. WhatsApp: ${NEGOCIO.whatsapp}.`;
const LEGAL = {
privacidad: { t:"Aviso de privacidad", h: () => `
<p class="fecha">Última actualización: ${F}</p>
<h2>Quién es el responsable</h2><p>${contacto()}</p>
<h2>Qué datos recabamos</h2><p>Solo los que tú escribes al hacer un pedido o pedir una cotización: tu nombre, el contenido del pedido, notas, y para fiestas el tipo y fecha del evento, número de invitados y lugar o colonia. Cuando nos escribes por WhatsApp también recibimos tu número de teléfono. No pedimos datos bancarios en este sitio ni recabamos datos personales sensibles.</p>

<h2>Con quién los compartimos</h2><p>No transferimos tus datos a terceros, salvo que una autoridad competente lo exija por ley.</p>
<h2>Tus derechos</h2><p>Puedes acceder a tus datos, rectificarlos, cancelarlos u oponerte a su uso (derechos ARCO), y retirar tu consentimiento, escribiendo a ${d(NEGOCIO.correo)} o por WhatsApp. Indica tu nombre, qué derecho quieres ejercer y a qué datos se refiere. Responderemos en los plazos que marca la ley.</p>
<h2>Menores de edad</h2><p>Si eres menor de 18 años, pide a una persona adulta que haga el pedido.</p>
<h2>Cambios y autoridad</h2><p>Si cambiamos este aviso, publicaremos la nueva versión en esta página. Si consideras que se vulneraron tus derechos, puedes acudir a la Secretaría Anticorrupción y Buen Gobierno, autoridad en protección de datos personales de particulares.</p>` },
terminos: { t:"Términos y condiciones", h: () => `
<p class="fecha">Última actualización: ${F}</p>
<h2>Quiénes somos</h2><p>${NEGOCIO.nombre} es un negocio de antojitos con fruta y dulces. ${contacto()}</p>
<h2>Cómo funciona un pedido</h2><p>Este sitio es un menú. No cobra en línea: el pedido se arma aquí y se confirma por WhatsApp, donde acordamos entrega o recolección, forma de pago y hora. Un pedido no es definitivo hasta que lo confirmemos por ese medio.</p>
<h2>Precios y disponibilidad</h2><p>Los precios están en pesos mexicanos. El precio y la disponibilidad que confirmamos por WhatsApp antes de que pagues son los que valen. Las promociones duran lo que indique su descripción o hasta agotar existencias.</p>
<h2>Fotos e ingredientes</h2><p>Las fotos son ilustrativas; el producto puede variar un poco. Si tienes alguna alergia o restricción, pregúntanos antes de pedir: nuestros productos pueden contener chile, azúcar, colorantes y otros ingredientes, y se preparan en un espacio donde hay frutos secos y otros alérgenos.</p>
<h2>Cotizaciones para fiestas</h2><p>La cotización es informativa y está sujeta a disponibilidad de fecha. Se confirma por WhatsApp. Condiciones de anticipo y cancelación: ${d("[COMPLETA: anticipo y cancelación de eventos]")}.</p>
<h2>Marcas y contenido</h2><p>Las marcas que aparecen en fotos o textos pertenecen a sus dueños y se mencionan solo para describir los productos; no hay relación comercial con ellas. Las fotos y textos de este sitio son de ${NEGOCIO.nombre}; no los uses sin permiso.</p>
<h2>Ley aplicable y reclamaciones</h2><p>Estos términos se rigen por las leyes de México. Puedes presentar quejas por los medios de contacto de arriba o ante la Procuraduría Federal del Consumidor (Profeco).</p>` },
cookies: { t:"Política de cookies", h: () => `
<p class="fecha">Última actualización: ${F}</p>
<h2>Resumen</h2><p>Este sitio no usa cookies propias, ni de analítica, ni de publicidad. Tampoco guarda información en tu navegador. Por eso no mostramos un aviso de cookies.</p>
<h2>Servicios de terceros</h2><ul><li><strong>Google Fonts:</strong> tu navegador pide las letras del sitio a Google, que puede recibir tu dirección IP y datos técnicos del navegador.</li><li><strong>WhatsApp (Meta) e Instagram:</strong> solo cuando tú pulsas esos enlaces o botones; después aplican sus propias políticas.</li><li><strong>Alojamiento del sitio:</strong> el servicio que lo hospeda puede registrar datos técnicos de conexión para operar y proteger el servicio.</li></ul>
<h2>Si esto cambia</h2><p>Si más adelante agregamos analítica, píxeles de publicidad u otras cookies, actualizaremos esta política y este sitio antes de usarlas.</p>` },
reembolsos: { t:"Reembolsos, cambios y cancelaciones", h: () => `
<p class="fecha">Última actualización: ${F}</p>
<h2>Productos con problema</h2><p>Nuestros productos son alimentos perecederos. Si tu pedido llega en mal estado, incompleto o distinto a lo que pediste, avísanos por WhatsApp el mismo día, con una foto y tu nombre, y lo reponemos o te devolvemos el importe, según prefieras y según disponibilidad.</p>
<h2>Cancelaciones</h2><p>Puedes cancelar sin costo antes de que empecemos a preparar tu pedido. Una vez preparado, por ser alimento perecedero, no hay devolución salvo por las razones de arriba.</p>
<h2>Cómo te devolvemos el dinero</h2><p>Por el mismo medio con el que pagaste, en un plazo de ${d("[COMPLETA: días]")}.</p>
<h2>Eventos y fiestas</h2><p>${d("[COMPLETA: condiciones de anticipo, cambio de fecha y cancelación de eventos]")}.</p>
<h2>Reclamaciones</h2><p>Escríbenos a ${d(NEGOCIO.correo)} o por WhatsApp. Si no quedas conforme, puedes acudir a Profeco.</p>` }

function pintarPie(){
  $("pie").innerHTML = `<p><strong>${NEGOCIO.nombre}</strong> · ${d(NEGOCIO.responsable)}</p><p>${d(NEGOCIO.domicilio)} · Tel. ${d(NEGOCIO.telefono)} · ${d(NEGOCIO.correo)}</p>
  <nav aria-label="Información legal"><a href="#/privacidad">Aviso de privacidad</a><a href="#/terminos">Términos y condiciones</a><a href="#/cookies">Política de cookies</a><a href="#/reembolsos">Reembolsos y cancelaciones</a></nav>
  <p>Fotos ilustrativas. Las marcas mencionadas pertenecen a sus dueños y no tenemos relación con ellas.</p>`;
}
function ruta(){
  const k = (location.hash.match(/^#\/(\w+)/)||[])[1], P = LEGAL[k];
  $("inicio").hidden = $("menu").hidden = !!P; $("legal").hidden = !P; $("fab").hidden = !!P;
  if(P){ $("legal").innerHTML = `<a href="#/">← Volver al menú</a><h1 tabindex="-1" id="lt">${P.t}</h1>${P.h()}`; document.title = P.t+" · "+NEGOCIO.nombre; window.scrollTo(0,0); $("lt").focus({preventScroll:true}); }
  else document.title = NEGOCIO.nombre+" · Menú";
}
window.addEventListener("hashchange", ruta);
pintarPie(); ruta();
